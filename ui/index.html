<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps Business Crawler Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #333;
        }
        .container {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #005a9e;
        }
        button:active {
            transform: scale(0.98);
        }
        #crawl {
            background-color: #28a745;
        }
        #crawl:hover {
            background-color: #218838;
        }
        .log-container {
            flex: 1;
            background-color: #000;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #00ff41; /* Classic Terminal Green */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .status-bar {
            background-color: #1f1f1f;
            padding: 10px 20px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

<header>
    <h1>Google Maps Business Crawler</h1>
</header>

<div class="container">
    <div class="controls">
        <button id="collect">1. Collect Links</button>
        <button id="crawl">2. Crawl Details</button>
    </div>

    <div class="log-container" id="logBox">
        [System] Ready to start...
    </div>
</div>

<div class="status-bar">
    System: Ubuntu 24.04 | Engine: Electron & Playwright
</div>

<script src="./renderer.js"></script>

</body>
</html>
